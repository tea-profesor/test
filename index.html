<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Мини Апп</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 400px;
        }

        h1 {
            font-size: 16px;
            color: #ff8c00;
            margin-bottom: 40px;
            line-height: 1.6;
            text-shadow: 3px 3px 0px #000000;
        }

        .greeting {
            font-size: 12px;
            color: #ffd700;
            margin-bottom: 30px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .pixel-button {
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            padding: 15px 30px;
            border: 4px solid #000000;
            cursor: pointer;
            text-transform: uppercase;
            position: relative;
            box-shadow: 4px 4px 0px #000000;
            transition: all 0.1s;
        }

        .pixel-button:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000000;
        }

        .btn-salute {
            background-color: #ff8c00;
            color: #ffffff;
        }

        .btn-salute:hover {
            background-color: #ffa500;
        }

        .btn-start {
            background-color: #4169e1;
            color: #ffffff;
        }

        .btn-start:hover {
            background-color: #5a7ff0;
        }

        .pixel-decoration {
            margin-top: 40px;
            font-size: 10px;
            color: #808080;
        }

        /* Анимация для салюта */
        .firework {
            position: fixed;
            width: 4px;
            height: 4px;
            background-color: #ff8c00;
            pointer-events: none;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty));
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ДОБРО ПОЖАЛОВАТЬ В МОЙ МИНИ АПП</h1>
        <div class="greeting" id="greeting">Загрузка...</div>
        
        <div class="button-container">
            <button class="pixel-button btn-salute" onclick="salute()">САЛЮТ</button>
            <button class="pixel-button btn-start" onclick="start()">СТАРТ</button>
        </div>

        <div class="pixel-decoration">
            ★ 8-BIT STYLE ★
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Получение имени пользователя
        const user = tg.initDataUnsafe.user;
        const greetingElement = document.getElementById('greeting');
        
        if (user) {
            const firstName = user.first_name || 'Друг';
            greetingElement.textContent = `Привет, ${firstName}!`;
        } else {
            greetingElement.textContent = 'Привет, Друг!';
        }

        // Функция салюта
        function salute() {
            const colors = ['#ff8c00', '#ffd700', '#ff4500', '#ffffff'];
            
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    firework.style.left = '50%';
                    firework.style.top = '50%';
                    firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    
                    const angle = (Math.PI * 2 * i) / 20;
                    const distance = 100 + Math.random() * 100;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;
                    
                    firework.style.setProperty('--tx', `${tx}px`);
                    firework.style.setProperty('--ty', `${ty}px`);
                    
                    document.body.appendChild(firework);
                    
                    setTimeout(() => firework.remove(), 1000);
                }, i * 50);
            }

            // Вибрация на мобильных
            if (navigator.vibrate) {
                navigator.vibrate(100);
            }
        }

        // Функция старт
        function start() {
            alert('ИГРА НАЧАЛАСЬ! 🎮');
            
            // Отправка данных боту
            tg.sendData('start_game');
        }

        // Установка цветов темы Telegram
        if (tg.colorScheme === 'dark') {
            document.body.style.backgroundColor = '#1a1a1a';
        } else {
            document.body.style.backgroundColor = '#f0f0f0';
            document.body.style.color = '#1a1a1a';
        }
    </script>
</body>
</html>
